name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare @habitflow/db
        run: npm run db:generate && npm run build -w @habitflow/db

      - name: Run tests
        run: npm run test

      - name: Build static export
        working-directory: apps/web
        env:
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_API_URL: https://habitflow-api.zaiedd.workers.dev/api/v1
          NEXT_PUBLIC_SITE_URL: https://habitflow-esf.pages.dev
        run: npm run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          if-no-files-found: error

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy apps/web/out --project-name habitflow

  deploy-api:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare @habitflow/db
        run: npm run db:generate && npm run build -w @habitflow/db

      - name: Build worker bundle
        working-directory: apps/api
        run: npm run build

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          workingDirectory: apps/api
