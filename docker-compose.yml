# HabitFlow local development services (PostgreSQL + Redis)
# Requires Docker. Start with: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: habitflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: habitflow
      POSTGRES_PASSWORD: habitflow
      POSTGRES_DB: habitflow
    ports:
      - "5432:5432"
    volumes:
      - habitflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitflow -d habitflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: habitflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - habitflow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  habitflow_pg_data:
  habitflow_redis_data:
